; Pool PHP-FPM SmartDent (exécuté par appuser, sans root)
[global]
daemonize = no
; PHP-FPM ouvre toujours un fichier de log. /proc/self/fd/2 est refusé à un utilisateur non-root
; dans Docker : l'entrypoint crée donc ce FIFO et le relaie vers stderr (docker compose logs).
error_log = /tmp/php-fpm.log

[www]
listen = 0.0.0.0:9000

pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500

; Indispensable : laisse passer les variables d'environnement Docker (DB_*, APP_KEY, ...) à Laravel
clear_env = no

; Renvoie les logs PHP/Laravel (stderr) vers `docker compose logs`
catch_workers_output = yes
decorate_workers_output = no

; La génération PDF (Chromium) peut prendre quelques secondes
request_terminate_timeout = 120s
