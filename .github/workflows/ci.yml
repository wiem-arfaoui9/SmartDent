# SmartDent - Étape 3 DevOps : pipeline CI (GitHub Actions)
# Équivalent du .gitlab-ci.yml : stages test -> build, déclenché à chaque push.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Principe du moindre privilège : le pipeline ne fait que lire le dépôt
permissions:
  contents: read

# Un nouveau push annule l'exécution précédente de la même branche
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────── Stage "test" ─────────────
  backend-checks:
    name: Backend Laravel (lint + démarrage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, bcmath, pdo_mysql, dom, curl, zip, intl
          tools: composer:v2
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Valider composer.json
        run: composer validate --no-check-publish

      # Git ne suit pas les dossiers vides : sans eux, "composer install" échoue
      # ("Please provide a valid cache path") dans le script package:discover.
      - name: Préparer les dossiers Laravel
        run: |
          mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views \
                   storage/logs storage/app/public bootstrap/cache

      - name: Installer les dépendances
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Vérifier la syntaxe PHP
        run: find app bootstrap config database routes -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Démarrer Laravel (routes chargées)
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan route:list --except-vendor

      # Informatif : le code existant n'est pas encore formaté selon Pint (n'échoue pas le pipeline)
      - name: Style du code (Pint)
        continue-on-error: true
        run: ./vendor/bin/pint --test

      # S'exécute uniquement si des tests PHPUnit sont ajoutés au projet
      - name: Tests PHPUnit
        run: |
          if [ -f phpunit.xml ] || [ -f phpunit.xml.dist ]; then
            php artisan test
          else
            echo "Aucun phpunit.xml : étape ignorée (à activer quand des tests seront ajoutés)."
          fi

  frontend-checks:
    name: Frontend React (build Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Build de production
        run: npm run build
        env:
          VITE_API_URL: /api

  # ───────────── Stage "build" ─────────────
  # Construit les images (tag = SHA court du commit, comme $CI_COMMIT_SHORT_SHA)
  # puis démarre toute la stack pour vérifier qu'elle fonctionne vraiment.
  build-images:
    name: Build images Docker + test de démarrage
    needs: [backend-checks, frontend-checks]
    # Comme la règle GitLab : uniquement sur main (ou lancement manuel)
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # packages: write = droit de publier sur GHCR avec le GITHUB_TOKEN (aucun secret à créer)
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Calculer le tag de l'image
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Générer .env (secrets aléatoires, jamais commités)
        run: sh scripts/init-env.sh

      - name: Valider docker-compose.yml
        run: docker compose config --quiet

      - name: Construire les images
        run: |
          docker compose build
          docker tag "smartdent/backend:${IMAGE_TAG}"  smartdent/backend:latest
          docker tag "smartdent/frontend:${IMAGE_TAG}" smartdent/frontend:latest
          echo "Images construites : smartdent/backend:${IMAGE_TAG}, smartdent/frontend:${IMAGE_TAG}"
          docker image ls 'smartdent/*'

      - name: Démarrer la stack (attend les healthchecks)
        run: docker compose up -d --wait --wait-timeout 300

      - name: Test de bout en bout (santé + login Sanctum)
        run: |
          set -eu
          B=http://localhost:8080
          curl -fsS -o /dev/null "$B/up"
          curl -fsS "$B/" | grep -qi '<div id="root"'
          jar=$(mktemp)
          curl -fsS -c "$jar" -b "$jar" -H "Origin: $B" -H "Referer: $B/" -o /dev/null "$B/sanctum/csrf-cookie"
          xsrf=$(awk '/XSRF-TOKEN/ {print $7}' "$jar" | sed 's/%3D/=/g')
          curl -fsS -c "$jar" -b "$jar" -H "Origin: $B" -H "Referer: $B/" \
            -H "X-XSRF-TOKEN: $xsrf" -H "Accept: application/json" -H "Content-Type: application/json" \
            -d '{"email":"admin@smartdent.com","password":"password"}' "$B/api/login" | grep -q '"token"'
          echo "OK : /up, SPA, cookie CSRF et login Sanctum fonctionnent."

      # Publication seulement après un test réussi : on ne publie que des images validées
      - name: Connexion à GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pousser les images vers GHCR
        if: github.ref == 'refs/heads/main'
        run: |
          set -eu
          owner="${GITHUB_REPOSITORY_OWNER,,}"   # GHCR exige des minuscules
          for svc in backend frontend; do
            dst="ghcr.io/${owner}/smartdent-${svc}"
            docker tag "smartdent/${svc}:${IMAGE_TAG}" "${dst}:${IMAGE_TAG}"
            docker tag "smartdent/${svc}:${IMAGE_TAG}" "${dst}:latest"
            docker push "${dst}:${IMAGE_TAG}"
            docker push "${dst}:latest"
            echo "Poussé : ${dst}:${IMAGE_TAG} et :latest"
          done

      - name: Logs en cas d'échec
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=200

      - name: Nettoyer
        if: always()
        run: docker compose down -v

  # ───────────── Stage "push" (étape 4) ─────────────
  # Pousse les images vers Harbor. Harbor tourne sur TON ordinateur : seul un runner
  # auto-hébergé (label "local") peut l'atteindre. Les runners GitHub (cloud) ne le peuvent pas.
  # Le job est ignoré tant que la variable HARBOR_REGISTRY n'est pas définie.
  push-harbor:
    name: Push des images vers Harbor
    needs: build-images
    if: github.ref == 'refs/heads/main' && vars.HARBOR_REGISTRY != ''
    runs-on: [self-hosted, local]
    timeout-minutes: 45
    env:
      REGISTRY: ${{ vars.HARBOR_REGISTRY }}
      PROJECT: ${{ vars.HARBOR_PROJECT || 'devops' }}
    steps:
      - uses: actions/checkout@v4

      - name: Calculer le tag de l'image
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      # Identifiants = secrets GitHub (Settings > Secrets and variables > Actions), jamais en dur
      - name: Connexion à Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Construire les images
        run: |
          sh scripts/init-env.sh
          docker compose build

      - name: Tagger et pousser vers Harbor
        run: |
          set -eu
          for svc in backend frontend; do
            src="smartdent/${svc}:${IMAGE_TAG}"
            dst="${REGISTRY}/${PROJECT}/smartdent-${svc}"
            docker tag "$src" "${dst}:${IMAGE_TAG}"
            docker tag "$src" "${dst}:latest"
            docker push "${dst}:${IMAGE_TAG}"
            docker push "${dst}:latest"
            echo "Poussé : ${dst}:${IMAGE_TAG} et :latest"
          done
