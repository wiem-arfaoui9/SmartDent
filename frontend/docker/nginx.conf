# Nginx SmartDent : sert React (SPA) et relaie l'API Laravel vers PHP-FPM (FastCGI).
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 25M;

    # Résolution DNS Docker dynamique (le backend peut être recréé sans redémarrer Nginx)
    resolver 127.0.0.11 valid=10s ipv6=off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API Laravel + cookie CSRF Sanctum + healthcheck Laravel (/up) : tout passe par index.php
    location ~ ^/(api|sanctum|up)(/|$) {
        rewrite ^ /index.php last;
    }

    # Point d'entrée Laravel exécuté par PHP-FPM (conteneur backend). Non accessible directement.
    # REQUEST_URI reste l'URL d'origine (/api/...), que Laravel utilise pour le routage.
    location = /index.php {
        internal;
        root /var/www/html/public;
        set $php_upstream backend:9000;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass $php_upstream;

        fastcgi_connect_timeout 5s;
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Fichiers statiques Vite (noms hachés)
    location /assets/ {
        expires 7d;
        try_files $uri =404;
    }

    # Application React : toute autre route renvoie index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Jamais de fichiers cachés
    location ~ /\.(?!well-known) {
        deny all;
    }
}
